app = "windom-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Migrations run once per deploy in their own short-lived machine, before the new
# release goes live. Keeping them out of the app's entrypoint means a read-only or
# unreachable database fails the deploy rather than crash-looping a running app -
# see issue #303 and incident #307.
[deploy]
  release_command = "node dist/db/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 3

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
