app = "windom-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Migrations run once per deploy in their own short-lived machine, before the new
# release goes live. Keeping them out of the app's entrypoint means a read-only or
# unreachable database fails the deploy rather than crash-looping a running app -
# see issue #303 and incident #307.
[deploy]
  release_command = "node dist/db/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 3

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Measured on the live machine 2026-10-20: node RSS 84 MB against 207 MB usable and
# ~120 MB available, with the apparent 150 MB of "usage" being mostly reclaimable page
# cache. The V8 heap would have to roughly double before 256 MB became tight.
#
# This declared 512mb while the running machine had been 256MB since Fly recreated it
# on 2026-10-08, so the file described infrastructure that did not exist and the next
# ordinary deploy would have silently doubled both the RAM and its cost. Reconciling
# downward is a no-op for production and keeps the current bill. Resizing is a one-line
# change plus a deploy, so scale up on evidence rather than pre-emptively. See #305.
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
