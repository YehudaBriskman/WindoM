version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      web-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-compatible:
        patterns: ['*']
        update-types: [minor, patch]
