name: Deploy site to GitHub Pages

# Replaces the "deploy from branch /docs" setting. That arrangement meant the
# built site was the source, nothing validated it, and a broken page shipped to
# windom.app on merge - `grep -rn "docs" .github/` previously returned nothing
# at all.
#
# Requires the repository Pages source to be set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  # Lets the site be redeployed without a content change, for example after
  # flipping the Pages source over.
  workflow_dispatch:

# Pages needs these; the default token is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued deploy finishes
# rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Every route is emitted at two addresses: the clean URL we want, and the
      # .html one already registered somewhere we do not control - the store
      # listing, and the guide link compiled into the extension, which would
      # need a store release to repair. Both shapes are asserted, because the
      # way a generated pair regresses is one half of it quietly going missing.
      - name: Verify every public URL still exists
        run: |
          missing=0
          for f in guide privacy terms support contact local-setup \
                   he/guide he/privacy he/terms he/support he/contact he/local-setup; do
            for shape in "$f.html" "$f/index.html"; do
              if [ -f "dist/$shape" ]; then
                echo "  ok       $shape"
              else
                echo "::error::dist/$shape is missing - this URL is referenced by the"
                echo "::error::published extension or the store listing and cannot move."
                missing=1
              fi
            done
          done
          for f in index.html 404.html sitemap.xml CNAME; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing."; missing=1; }
          done
          # The search index is generated from the rendered pages, so an empty
          # or absent one means the extraction stopped matching the markup -
          # which the prerender itself would not notice.
          sections=$(grep -o '"id"' dist/search-index.json 2>/dev/null | wc -l)
          echo "  search index: $sections sections"
          if [ "$sections" -lt 50 ]; then
            echo "::error::dist/search-index.json has $sections sections - expected well over 50."
            missing=1
          fi
          exit $missing

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Pages reports the deploy complete before its CDN has finished serving the
      # new files, so checking immediately reports a false failure - the first run
      # of this step failed on a URL that was serving correctly less than a minute
      # later. Retry rather than either trusting the deploy blindly or sleeping a
      # fixed amount and hoping.
      # The list is read from the deployed sitemap rather than written out here,
      # so adding a page or a language cannot leave this check behind. The
      # sitemap carries the clean URLs; each one's .html twin is derived, which
      # is how the store's registered address gets checked too.
      - name: Verify the live URLs the extension depends on
        run: |
          clean=$(curl -s --retry 6 --retry-delay 15 --retry-all-errors --max-time 20 \
                    https://windom.app/sitemap.xml \
                  | grep -o '<loc>[^<]*</loc>' | sed -e 's#</\?loc>##g' -e 's#https://windom.app##')
          if [ -z "$clean" ]; then
            echo "::error::sitemap.xml served no URLs - the deploy or the sitemap build is broken."
            exit 1
          fi
          paths="$clean"
          for path in $clean; do
            [ "$path" = "/" ] || paths="$paths $path.html"
          done
          echo "  checking $(printf '%s\n' $paths | wc -l) URLs across both shapes"
          failed=0
          for path in $paths; do
            code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://windom.app$path" || echo 000)
              [ "$code" = "200" ] && break
              sleep 15
            done
            printf '  %-22s %s\n' "$path" "$code"
            if [ "$code" != "200" ]; then
              echo "::error::https://windom.app$path returned $code after six attempts over 90s."
              failed=1
            fi
          done
          # Report every bad URL rather than stopping at the first, so one run
          # tells you everything that is wrong.
          exit $failed

      # A 200 is not enough for the legal pages. They were served as an empty
      # 2KB shell that filled itself in from JavaScript, which reads as a blank
      # document to anything that does not run a bundle - including the OAuth
      # verification check that fetches the privacy policy and looks for the
      # scopes and the Limited Use statement. They are prerendered now, and the
      # way that regresses is silently, so the content is asserted rather than
      # the status code.
      - name: The privacy policy is readable without JavaScript
        run: |
          failed=0
          # Both addresses, because the reviewer may hold either: the store
          # listing still points at the .html one.
          for url in https://windom.app/privacy https://windom.app/privacy.html; do
            body=$(curl -s --max-time 20 "$url")
            for phrase in "Limited Use" "calendar.readonly" "Google API Services" "User Data Policy"; do
              if printf '%s' "$body" | grep -qi "$phrase"; then
                printf '  found in %-32s %s\n' "$url" "$phrase"
              else
                echo "::error::$url does not contain \"$phrase\" without JavaScript."
                failed=1
              fi
            done
            size=$(printf '%s' "$body" | wc -c)
            echo "  $url served $size bytes"
            # The pre-fix shell was ~2.2KB. Anything near that is the shell again.
            if [ "$size" -lt 6000 ]; then
              echo "::error::$url is only $size bytes - the prerender did not run."
              failed=1
            fi
          done
          exit $failed
