name: Publish to Chrome Web Store

# Only runs when you push a version tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'

# Restrict the GITHUB_TOKEN to read-only - this workflow only needs
# to build code and call the Chrome Web Store API, never write back to the repo.
permissions:
  contents: read

jobs:
  # Publishing to the store is irreversible in practice - users auto-update to whatever
  # is pushed, and the store refuses a re-upload of a version it already holds. Before
  # this gate the workflow ran no lint, no type check, no tests, and no version check:
  # a tag published straight to users. It now shares the backend's gate, so the
  # extension and the API are held to the same bar and a tag either passes everything
  # or nothing ships.
  gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate

    # Use a dedicated "chrome-store" environment so you can add
    # reviewer approval rules & limit which branches/tags can deploy.
    environment: chrome-store

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate required publish secrets
        run: node ../.github/scripts/validate-publish-env.mjs
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Zip dist folder
        run: cd dist && zip -r ../../extension.zip . && cd ..

      - name: Preserve release package
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-${{ github.sha }}
          path: extension.zip
          if-no-files-found: error
          retention-days: 5

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          # Required since v7 of this action; v5 did not take it. The Dependabot bump
          # from v5 to v7 in #287 introduced the requirement silently, and nothing
          # caught it because this workflow only runs on a tag - so it surfaced six
          # months later, mid-release. Found under Publisher > Settings in the Chrome
          # Web Store Developer Dashboard.
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
