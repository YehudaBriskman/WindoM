name: Release Gate

# Shared pre-release gate for everything a version tag triggers.
#
# A tag is the only trigger for both the backend deploy and the Chrome Web Store
# publish, and those two workflows previously ran independently with weaker checks than
# ordinary CI. A tag could therefore deploy code that never type-checked, ship an
# extension whose version disagreed with the tag, or publish a build pointing at a host
# the manifest does not permit. Both tag workflows now depend on this gate, so a tag
# either passes every check or nothing is released.
#
# Called via `uses:` - see deploy-backend.yml and publish-chrome.yml.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag being validated (defaults to the triggering ref).
        required: false
        type: string
    secrets:
      VITE_BACKEND_URL:
        description: Backend origin the extension is built against.
        required: false

  # Lets the gate be dry-run against a candidate version before the tag exists.
  # Without this the gate only ever executes during a real release, so a bug in it
  # would first surface mid-deploy. Run this, confirm green, then tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate, e.g. v1.5.0. Required - the version checks compare against it.
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── Release metadata ───────────────────────────────────────────────────────
  # Deliberately first and dependency-free: these checks are deterministic and cost
  # seconds, so a mistyped tag fails before any expensive job starts.
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the tagged commit's ancestry can be tested against main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A tag can be created on ANY commit, including one on an unmerged branch or a
      # commit that was force-pushed away. `needs: gate` guarantees the checks passed,
      # but says nothing about where the tagged code came from - so without this, a tag
      # on an unreviewed branch would deploy to production and publish to the store.
      # Releases must come from history that is on main, where branch protection and
      # required reviews apply.
      #
      # Skipped for manual dry runs, which legitimately run from a feature branch.
      - name: Tagged commit must be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is on main."
          else
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/main."
            echo "::error::Release tags must point at reviewed history that has been merged"
            echo "::error::to main. Merge the work first, then tag the resulting commit."
            exit 1
          fi

      - name: Test the validators themselves
        run: node --test .github/scripts/*.test.mjs

      - name: Tag agrees with every declared version
        run: node .github/scripts/validate-release-version.mjs

      - name: Backend origin is permitted by the manifest
        # Falls back to the value ci.yml builds with, so the check still runs when the
        # workflow is called without the secret available.
        run: node .github/scripts/validate-backend-origin.mjs
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windom
          POSTGRES_PASSWORD: windom
          POSTGRES_DB: windom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://windom:windom@localhost:5433/windom_test
      DATABASE_URL_TEST: postgresql://windom:windom@localhost:5433/windom_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail on a drifted lock file
        # `npm ci` already refuses a lock file that disagrees with package.json, but a
        # lock file regenerated by a different npm major can still reorder entries. A
        # dirty tree here means the committed lock file is not what CI resolves.
        run: git diff --exit-code -- package-lock.json

      # config.ts validates its environment with Zod and calls process.exit(1) when a
      # secret is absent, which fails every test that imports it. Generated per run
      # rather than read from repository secrets so fork-triggered runs work too and no
      # real secret is referenced, matching how ci.yml does it.
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TOKEN_ENC_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        # Absent from the old deploy workflow, so a tag could deploy code that does
        # not compile. ci.yml had this; the release path did not.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Validate migration history
        # Catches duplicate or out-of-order migration entries in the journal.
        run: npx drizzle-kit check

      - name: Fail on schema not captured by a migration
        # Regenerates migrations from schema.ts; any new file means schema.ts changed
        # without a committed migration, which would deploy code expecting columns the
        # database will not have.
        run: |
          npx drizzle-kit generate
          if ! git diff --exit-code -- drizzle; then
            echo "::error::schema.ts has changes with no committed migration."
            echo "::error::Run 'npx drizzle-kit generate' in backend/ and commit the result."
            exit 1
          fi

      - name: Migrate test database
        run: npx drizzle-kit migrate

      - name: Test
        run: npm test

  # ── Web extension ──────────────────────────────────────────────────────────
  web:
    name: Web extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail on a drifted lock file
        run: git diff --exit-code -- package-lock.json

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build with the release backend origin
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}

      - name: Manifest version agrees with the tag in the built output
        # Guards the build itself, not just the source: @crxjs rewrites the manifest at
        # build time, so the shipped version can differ from the committed one.
        run: |
          BUILT=$(node -p "require('./dist/manifest.json').version")
          EXPECTED="${RELEASE_TAG#v}"
          echo "built manifest version: $BUILT / expected: $EXPECTED"
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::Built manifest declares $BUILT but the tag is $EXPECTED."
            exit 1
          fi

      - name: Preserve the exact artifact the gate validated
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-extension-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 5

  # ── Container ──────────────────────────────────────────────────────────────
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image Fly will deploy
        run: docker build --tag windom-api:${{ github.sha }} backend

      # release_command in fly.toml runs this path; a rename would otherwise fail the
      # deploy only after the pre-deploy backup had already been taken.
      - name: Verify the release command exists in the image
        run: |
          docker run --rm --entrypoint sh windom-api:${{ github.sha }} -c \
            'test -f dist/db/migrate.js && test -d drizzle && test -f dist/index.js'
          echo "Image contains the migration entrypoint and migration files."

      # Pinned to the immutable commit behind signed release v0.36.0.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: windom-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ── Infrastructure preflight ───────────────────────────────────────────────
  # Checks the world outside the repo, which is where the 2026-10 outage lived: the
  # code was fine and CI was green while production was unreachable for months.
  preflight:
    name: Infrastructure preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Backend origin resolves in DNS
        # Issue #302: the extension was built against a hostname with no DNS record, so
        # every authenticated request failed for every user. Nothing in CI noticed,
        # because nothing ever resolved the host it was shipping.
        run: |
          URL="${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}"
          HOST=$(printf '%s' "$URL" | sed -E 's#^https?://##; s#[:/].*$##')
          echo "Resolving $HOST ..."
          if ! getent hosts "$HOST" > /dev/null; then
            echo "::error::$HOST does not resolve. The published extension would be unable"
            echo "::error::to reach its backend. Create the DNS record and a Fly certificate"
            echo "::error::for it before releasing (see issue #302)."
            exit 1
          fi
          getent hosts "$HOST"

      - name: Production database can accept writes
        # Migrations run as a release_command, so a read-only database fails the deploy
        # after the pre-deploy backup. Failing here instead keeps the release atomic.
        #
        # Tolerates 404 so the first release carrying /health/ready is not blocked by
        # the endpoint's absence on the currently deployed version.
        run: |
          URL="https://windom-api.fly.dev/health/ready"
          STATUS=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 20 "$URL" || echo "000")
          echo "readiness status: $STATUS"
          cat /tmp/ready.json 2>/dev/null || true
          echo
          case "$STATUS" in
            200) echo "Production database is writable." ;;
            404) echo "::notice::/health/ready is absent from the deployed version - skipping." ;;
            503)
              echo "::error::Production reports not-ready: its database is unreachable or"
              echo "::error::read-only. Migrations would fail mid-deploy. Fix the database first."
              exit 1
              ;;
            *)
              echo "::error::Could not determine production readiness (HTTP $STATUS)."
              echo "::error::Investigate before releasing."
              exit 1
              ;;
          esac

  # ── Single status for callers to depend on ─────────────────────────────────
  summary:
    name: Gate summary
    runs-on: ubuntu-latest
    needs: [metadata, backend, web, container, preflight]
    if: always()
    steps:
      - name: Report
        run: |
          printf '%-28s %s\n' \
            "Release metadata" "${{ needs.metadata.result }}" \
            "Backend" "${{ needs.backend.result }}" \
            "Web extension" "${{ needs.web.result }}" \
            "Container image" "${{ needs.container.result }}" \
            "Infrastructure preflight" "${{ needs.preflight.result }}"

      - name: Fail if any check did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Release gate failed - nothing will be deployed or published."
          exit 1
