name: Release Gate

# Shared pre-release gate for everything a version tag triggers.
#
# A tag is the only trigger for both the backend deploy and the Chrome Web Store
# publish, and those two workflows previously ran independently with weaker checks than
# ordinary CI. A tag could therefore deploy code that never type-checked, ship an
# extension whose version disagreed with the tag, or publish a build pointing at a host
# the manifest does not permit. Both tag workflows now depend on this gate, so a tag
# either passes every check or nothing is released.
#
# Called once per release via `uses:` from release.yml, which deploys the image and
# publishes the ZIP this gate produced - not rebuilds of them.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag being validated (defaults to the triggering ref).
        required: false
        type: string
      release:
        # Callers are real releases. Left unset only by a direct dispatch of this
        # workflow (a rehearsal), where `inputs.release` is null - see `resolve`.
        description: A real release (the tag must exist and be on main), not a rehearsal.
        required: false
        type: boolean
        default: true
    outputs:
      sha:
        description: The one commit every gate job checked. Deploy and publish check out this.
        value: ${{ jobs.resolve.outputs.sha }}
    secrets:
      VITE_BACKEND_URL:
        description: Backend origin the extension is built against.
        required: false

  # Lets the gate be dry-run against a candidate version before the tag exists.
  # Without this the gate only ever executes during a real release, so a bug in it
  # would first surface mid-deploy. Run this, confirm green, then tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate, e.g. v1.5.0. Required - the version checks compare against it.
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── Resolve the release to one commit ──────────────────────────────────────
  # Every job below used to check out the triggering ref. On a manual publish that
  # is the branch the dispatch ran from, while the publish uploaded the TAG - so
  # the gate could pass on main's code and the store receive a different commit.
  # Now the tag is turned into a SHA once, here, and every checkout in the gate,
  # the deploy and the publish uses that SHA.
  #
  # A tag can be created on ANY commit, including one on an unmerged branch, so a
  # real release must also point at history on main, where review applies. That
  # check used to be skipped for every manual run - the one path that publishes an
  # arbitrary tag. It is now skipped only for a rehearsal (a direct dispatch of this
  # workflow), which never deploys or publishes anything.
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags so the tag can be resolved and its ancestry tested.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tag exists, is on main, and is the commit that triggered the run
        id: resolve
        run: |
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/resolve-release-ref.mjs
        env:
          # `inputs.release` is true from both callers and null on a direct
          # dispatch; null == true is false, so a rehearsal never requires the tag.
          REQUIRE_TAG: ${{ inputs.release == true }}

  # ── Release metadata ───────────────────────────────────────────────────────
  # These checks are deterministic and cost seconds, so a mistyped tag fails
  # before any expensive job starts.
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: resolve
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the validators themselves
        run: node --test .github/scripts/*.test.mjs

      - name: Tag agrees with every declared version
        run: node .github/scripts/validate-release-version.mjs

      - name: Backend origin is permitted by the manifest
        # Falls back to the value ci.yml builds with, so the check still runs when the
        # workflow is called without the secret available.
        run: node .github/scripts/validate-backend-origin.mjs
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windom
          POSTGRES_PASSWORD: windom
          POSTGRES_DB: windom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://windom:windom@localhost:5433/windom_test
      DATABASE_URL_TEST: postgresql://windom:windom@localhost:5433/windom_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail on a drifted lock file
        # `npm ci` already refuses a lock file that disagrees with package.json, but a
        # lock file regenerated by a different npm major can still reorder entries. A
        # dirty tree here means the committed lock file is not what CI resolves.
        run: git diff --exit-code -- package-lock.json

      # config.ts validates its environment with Zod and calls process.exit(1) when a
      # secret is absent, which fails every test that imports it. Generated per run
      # rather than read from repository secrets so fork-triggered runs work too and no
      # real secret is referenced, matching how ci.yml does it.
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TOKEN_ENC_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        # Absent from the old deploy workflow, so a tag could deploy code that does
        # not compile. ci.yml had this; the release path did not.
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Validate migration history
        # Catches duplicate or out-of-order migration entries in the journal.
        run: npx drizzle-kit check

      - name: Fail on schema not captured by a migration
        # Regenerates migrations from schema.ts; any new file means schema.ts changed
        # without a committed migration, which would deploy code expecting columns the
        # database will not have.
        #
        # `git diff` only sees tracked files, so the usual shape of drift - a new,
        # untracked NNNN_name.sql - passed. The script reads `git status` instead.
        run: |
          npx drizzle-kit generate
          node ../.github/scripts/check-migration-drift.mjs drizzle

      - name: Migrate test database
        run: npx drizzle-kit migrate

      - name: Test
        run: npm test

  # ── Web extension ──────────────────────────────────────────────────────────
  web:
    name: Web extension
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail on a drifted lock file
        run: git diff --exit-code -- package-lock.json

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build with the release backend origin
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}

      - name: Manifest version agrees with the tag in the built output
        # Guards the build itself, not just the source: @crxjs rewrites the manifest at
        # build time, so the shipped version can differ from the committed one.
        run: |
          BUILT=$(node -p "require('./dist/manifest.json').version")
          EXPECTED="${RELEASE_TAG#v}"
          echo "built manifest version: $BUILT / expected: $EXPECTED"
          if [ "$BUILT" != "$EXPECTED" ]; then
            echo "::error::Built manifest declares $BUILT but the tag is $EXPECTED."
            exit 1
          fi

      # The ZIP is made HERE, from the dist the steps above checked, and the publish
      # job uploads this file - it no longer rebuilds. release-info.json records
      # what the publish must re-verify before uploading (release-package.mjs).
      # Written with jq rather than a repo script so that republishing a tag cut
      # before this file existed still works.
      - name: Package the checked build once, with its checksum
        run: |
          mkdir -p ../release-package
          (cd dist && zip -X -q -r ../../release-package/extension.zip .)
          SUM=$(sha256sum ../release-package/extension.zip | cut -d' ' -f1)
          VERSION=$(node -p "require('./dist/manifest.json').version")
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$SHA" --arg sum "$SUM" \
                --arg version "$VERSION" --arg origin "$VITE_BACKEND_URL" \
            '{tag: $tag, sha: $sha, sha256: $sum, manifestVersion: $version, backendOrigin: $origin}' \
            > ../release-package/release-info.json
          cat ../release-package/release-info.json
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}

      - name: Preserve the exact package the gate validated
        uses: actions/upload-artifact@v7
        with:
          name: release-extension-${{ needs.resolve.outputs.sha }}
          path: release-package/
          if-no-files-found: error
          retention-days: 5

  # ── Container ──────────────────────────────────────────────────────────────
  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build the image Fly will deploy
        run: docker build --tag windom-api:${{ needs.resolve.outputs.sha }} backend

      # release_command in fly.toml runs this path; a rename would otherwise fail the
      # deploy only after the pre-deploy backup had already been taken.
      - name: Verify the release command exists in the image
        run: |
          docker run --rm --entrypoint sh windom-api:${{ needs.resolve.outputs.sha }} -c \
            'test -f dist/db/migrate.js && test -d drizzle && test -f dist/index.js'
          echo "Image contains the migration entrypoint and migration files."

      # Pinned to the immutable commit behind signed release v0.36.0.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: windom-api:${{ needs.resolve.outputs.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # The deploy ships THIS image - the one built, entrypoint-checked and scanned
      # above - instead of letting Fly build the Dockerfile again remotely. The ID
      # is a content hash of the image config, so the deploy can prove that what it
      # loaded is what was scanned.
      - name: Save the scanned image for the deploy
        run: |
          mkdir -p release-image
          docker image inspect --format '{{.Id}}' "windom-api:$SHA" > release-image/image-id
          docker save "windom-api:$SHA" | gzip -1 > release-image/image.tar.gz
          echo "image $(cat release-image/image-id), $(du -h release-image/image.tar.gz | cut -f1) compressed"
        env:
          SHA: ${{ needs.resolve.outputs.sha }}

      - name: Preserve the exact image the gate scanned
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ needs.resolve.outputs.sha }}
          path: release-image/
          if-no-files-found: error
          retention-days: 3
          # Already gzipped; compressing again only costs time.
          compression-level: 0

  # ── Infrastructure preflight ───────────────────────────────────────────────
  # Checks the world outside the repo, which is where the 2026-10 outage lived: the
  # code was fine and CI was green while production was unreachable for months.
  preflight:
    name: Infrastructure preflight
    runs-on: ubuntu-latest
    needs: resolve
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Backend origin resolves in DNS
        # Issue #302: the extension was built against a hostname with no DNS record, so
        # every authenticated request failed for every user. Nothing in CI noticed,
        # because nothing ever resolved the host it was shipping.
        run: |
          URL="${{ secrets.VITE_BACKEND_URL || 'https://windom-api.fly.dev' }}"
          HOST=$(printf '%s' "$URL" | sed -E 's#^https?://##; s#[:/].*$##')
          echo "Resolving $HOST ..."
          if ! getent hosts "$HOST" > /dev/null; then
            echo "::error::$HOST does not resolve. The published extension would be unable"
            echo "::error::to reach its backend. Create the DNS record and a Fly certificate"
            echo "::error::for it before releasing (see issue #302)."
            exit 1
          fi
          getent hosts "$HOST"

      - name: Production database can accept writes
        # Migrations run as a release_command, so a read-only database fails the deploy
        # after the pre-deploy backup. Failing here instead keeps the release atomic.
        #
        # Tolerates 404 so the first release carrying /health/ready is not blocked by
        # the endpoint's absence on the currently deployed version.
        run: |
          URL="https://windom-api.fly.dev/health/ready"
          STATUS=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 20 "$URL" || echo "000")
          echo "readiness status: $STATUS"
          cat /tmp/ready.json 2>/dev/null || true
          echo
          case "$STATUS" in
            200) echo "Production database is writable." ;;
            404) echo "::notice::/health/ready is absent from the deployed version - skipping." ;;
            503)
              echo "::error::Production reports not-ready: its database is unreachable or"
              echo "::error::read-only. Migrations would fail mid-deploy. Fix the database first."
              exit 1
              ;;
            *)
              echo "::error::Could not determine production readiness (HTTP $STATUS)."
              echo "::error::Investigate before releasing."
              exit 1
              ;;
          esac

  # ── Single status for callers to depend on ─────────────────────────────────
  # Every job must have SUCCEEDED. This used to fail only on `failure` or
  # `cancelled`, so a `skipped` job - evidence of nothing - let the release through.
  summary:
    name: Gate summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [resolve, metadata, backend, web, container, preflight]
    if: always()
    steps:
      # Only the verdict script, from the triggering ref rather than the resolved
      # commit, which does not exist when `resolve` is the job that failed.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Every gate job succeeded
        run: node .github/scripts/check-gate-results.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: resolve metadata backend web container preflight
