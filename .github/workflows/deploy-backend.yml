name: Deploy Backend to Fly.io

on:
  push:
    tags:
      - 'v*'

jobs:
  # The full pre-release gate: metadata, backend, web, container image, and
  # infrastructure preflight. This replaced a lighter inline test job that ran neither
  # a type check nor a dependency audit, so a tag could deploy code that did not
  # compile. Defined once in release-gate.yml and shared with publish-chrome.yml, so
  # the extension and the backend are held to the same bar.
  gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Increase timeout: backup + migration + deploy + health check can take up to 20 min
    timeout-minutes: 20
    needs: gate

    steps:
      - uses: actions/checkout@v7

      # Pin the action to the immutable commit behind release 1.6.
      # This prevents an upstream tag or branch change from altering deploy code.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The image build and its Trivy scan now live in the release gate's `container`
      # job, which must pass before this job starts. Building here as well meant
      # compiling the same Dockerfile twice per release for no added safety.

      # ── Step 1: Pre-deploy database backup ───────────────────────────────────
      # Creates a Fly.io managed Postgres backup before ANY schema changes run.
      # The deploy is ABORTED if this fails - no backup means no safe rollback.
      # Requires FLY_POSTGRES_APP secret (the name of your Fly Postgres app, e.g. "windom-db").
      - name: Create pre-deploy database backup
        id: backup
        run: |
          echo "Creating pre-deploy database backup"
          flyctl postgres backup create \
            --app "$FLY_POSTGRES_APP"
          echo "Backup created successfully at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_POSTGRES_APP: ${{ secrets.FLY_POSTGRES_APP }}

      # ── Step 2: Deploy ────────────────────────────────────────────────────────
      # entrypoint.sh inside the image runs "node dist/db/migrate.js" before the
      # server starts. Fly's rolling deploy keeps the old machine alive until the
      # new one passes the /health check - so if migration or startup fails, the
      # old machine continues serving traffic automatically.
      - name: Deploy to Fly.io
        working-directory: backend
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Step 3: Post-deploy health check ─────────────────────────────────────
      # Verifies READINESS, not just liveness. /health stays 200 whenever the process
      # is alive - by design, so a degraded database cannot make Fly replace a machine
      # - which means it is useless as a deploy gate. /health/ready returns 503 when
      # the database is unreachable or read-only.
      #
      # This distinction is why incident #307 ran undetected for four months: the old
      # check polled /health, which reported healthy the entire time Postgres was
      # stuck read-only in archive recovery.
      - name: Verify production readiness
        run: |
          echo "Verifying https://windom-api.fly.dev/health/ready ..."
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -s --max-time 10 https://windom-api.fly.dev/health/ready || true)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://windom-api.fly.dev/health/ready || true)
            if [ "$STATUS" = "200" ]; then
              echo "Readiness check passed (attempt $i) - deployment successful."
              echo "$BODY"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            echo "  response: $BODY"
            sleep 10
          done
          echo "::error::Readiness check failed after 60s - the API is up but its database"
          echo "::error::is unreachable or read-only. Run: flyctl rollback -a windom-api"
          exit 1

      # ── Step 4: Post-deploy summary ───────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "===== Deployment complete ====="
          echo "Tag:           ${{ github.ref_name }}"
          echo "Backup at:     ${{ steps.backup.outputs.timestamp }}"
          echo "Health:        https://windom-api.fly.dev/health"
          echo ""
          echo "To roll back code only:  flyctl rollback -a windom-api"
          echo "To roll back database:   see Windom/runbooks/deploy-rollback.md"
