name: Deploy Backend to Fly.io

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windom
          POSTGRES_PASSWORD: windom
          POSTGRES_DB: windom_test
        ports:
          - 5433:5432  # Match local docker-compose port so DATABASE_URL_TEST works unchanged
        options: >-
          --health-cmd "pg_isready -U windom -d windom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Migrate test database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://windom:windom@localhost:5433/windom_test
          JWT_ACCESS_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.TEST_REFRESH_SECRET }}
          TOKEN_ENC_KEY_BASE64: ${{ secrets.TEST_ENC_KEY_BASE64 }}
          NODE_ENV: test
        run: npx tsx src/db/migrate.ts

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL_TEST: postgresql://windom:windom@localhost:5433/windom_test
          JWT_ACCESS_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.TEST_REFRESH_SECRET }}
          TOKEN_ENC_KEY_BASE64: ${{ secrets.TEST_ENC_KEY_BASE64 }}
          NODE_ENV: test
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Increase timeout: backup + migration + deploy + health check can take up to 20 min
    timeout-minutes: 20
    needs: test

    steps:
      - uses: actions/checkout@v7

      # Pin the action to the immutable commit behind release 1.6.
      # This prevents an upstream tag or branch change from altering deploy code.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Build the same Dockerfile Fly deploys and block releases containing
      # known high- or critical-severity OS/package vulnerabilities. Run this
      # before the database backup so a rejected image has no side effects.
      - name: Build backend image for vulnerability scan
        run: docker build --tag windom-api:${{ github.sha }} backend

      # Pinned to the immutable commit behind signed release v0.36.0.
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: windom-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # ── Step 1: Pre-deploy database backup ───────────────────────────────────
      # Creates a Fly.io managed Postgres backup before ANY schema changes run.
      # The deploy is ABORTED if this fails - no backup means no safe rollback.
      # Requires FLY_POSTGRES_APP secret (the name of your Fly Postgres app, e.g. "windom-db").
      - name: Create pre-deploy database backup
        id: backup
        run: |
          echo "Creating pre-deploy database backup"
          flyctl postgres backup create \
            --app "$FLY_POSTGRES_APP"
          echo "Backup created successfully at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_POSTGRES_APP: ${{ secrets.FLY_POSTGRES_APP }}

      # ── Step 2: Deploy ────────────────────────────────────────────────────────
      # entrypoint.sh inside the image runs "node dist/db/migrate.js" before the
      # server starts. Fly's rolling deploy keeps the old machine alive until the
      # new one passes the /health check - so if migration or startup fails, the
      # old machine continues serving traffic automatically.
      - name: Deploy to Fly.io
        working-directory: backend
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Step 3: Post-deploy health check ─────────────────────────────────────
      # Confirms the new version is actually serving traffic.
      # Retries for up to 60 s to give Fly's traffic switch time to settle.
      - name: Verify production health endpoint
        run: |
          echo "Verifying https://windom-api.fly.dev/health ..."
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://windom-api.fly.dev/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i) - deployment successful."
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 60s. Run: flyctl rollback -a windom-api"
          exit 1

      # ── Step 4: Post-deploy summary ───────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "===== Deployment complete ====="
          echo "Tag:           ${{ github.ref_name }}"
          echo "Backup at:     ${{ steps.backup.outputs.timestamp }}"
          echo "Health:        https://windom-api.fly.dev/health"
          echo ""
          echo "To roll back code only:  flyctl rollback -a windom-api"
          echo "To roll back database:   see Windom/runbooks/deploy-rollback.md"
