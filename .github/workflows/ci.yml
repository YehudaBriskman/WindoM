name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run - it is about to be
# superseded anyway. Pushes to main are keyed by commit and never cancelled:
# GitHub drops a PENDING run in a shared group even with cancel-in-progress off,
# which would leave a merged commit with no CI result at all.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── What changed ─────────────────────────────────────────────────────────
  # Each suite below runs only when its tree changed. Anything under .github/
  # runs all of them, and if the diff cannot be computed every suite runs - see
  # .github/scripts/changed-components.mjs. A skipped job counts as passing for a
  # required check, so the required checks still gate every PR.
  changes:
    name: Changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      web: ${{ steps.diff.outputs.web }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base has to be present to diff against it. The repository
          # is ~19 MB, so full history costs seconds.
          fetch-depth: 0

      - id: diff
        run: node .github/scripts/changed-components.mjs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}

  # ── Backend ──────────────────────────────────────────────────────────────
  ci-backend:
    name: Backend - lint / typecheck / test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: windom
          POSTGRES_PASSWORD: windom
          POSTGRES_DB: windom_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test release safeguards
        run: node --test ../.github/scripts/*.test.mjs

      # Repository secrets are intentionally unavailable to workflows triggered
      # from forks. Generate isolated, non-production values so contributor PRs
      # can run the complete backend suite without access to any real secret.
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TOKEN_ENC_KEY_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run migrations on test DB
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgresql://windom:windom@localhost:5433/windom_test

      - name: Run tests
        run: npm test
        env:
          # Minimal env required by config.ts Zod schema
          DATABASE_URL: postgresql://windom:windom@localhost:5433/windom_test
          DATABASE_URL_TEST: postgresql://windom:windom@localhost:5433/windom_test
          NODE_ENV: test

  # ── Web extension ─────────────────────────────────────────────────────────
  ci-web:
    name: Web - lint / typecheck / build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: https://windom-api.fly.dev

      - name: Preserve extension build
        uses: actions/upload-artifact@v7
        with:
          name: extension-build-${{ github.sha }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 5

      - name: Run tests
        run: npm test

  # ── Marketing site ────────────────────────────────────────────────────────
  # The site previously had no CI at all: nothing in .github referenced it, so a
  # broken page merged straight through to windom.app.
  #
  # Pull requests only. On main, deploy-site.yml runs the same checks on the build
  # it uploads to Pages, so running them here as well built the site twice per
  # merge for no added safety.
  ci-site:
    name: Site - lint / typecheck / build
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify every public URL still exists
        run: bash scripts/verify-dist.sh

      # Measured all the way down each page, not just at the top: the day stage
      # and the beat glows only overhang mid-scroll (#412, #413, #414).
      - name: Install Chromium for the overflow audit
        run: npx playwright install --with-deps --only-shell chromium

      - name: No horizontal overflow at any scroll position
        run: npm run audit:overflow
