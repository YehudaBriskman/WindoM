<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found - WindoM</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080810" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!--
      Deliberately a standalone page with inline styles rather than a React
      entry. GitHub Pages serves this for any unmatched path, including paths
      with no bundle to load, and a 404 that needs JavaScript to tell you it is
      a 404 is a blank screen.
    -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #080810;
        color: #e8e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.7;
        text-align: center;
      }
      main { max-width: 46ch; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 12px; letter-spacing: -0.03em; }
      p { color: #7d7d9a; margin: 0 0 28px; }
      nav { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: center; }
      a { color: #9a9ab5; }
      a:hover { color: #e8e8f0; }
      .home {
        display: inline-block;
        margin-bottom: 24px;
        padding: 12px 26px;
        border-radius: 12px;
        background: linear-gradient(120deg, #7b9ef5, #a78bfa);
        color: #06060c;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That address does not exist on windom.app. It may have moved, or the link may be wrong.</p>
      <a class="home" href="/">Back to WindoM</a>
      <nav>
        <a href="/guide.html">User Guide</a>
        <a href="/support.html">Support</a>
        <a href="/contact.html">Contact</a>
        <a href="/privacy.html">Privacy</a>
        <a href="https://github.com/YehudaBriskman/WindoM">GitHub</a>
      </nav>
    </main>
  </body>
</html>
